<!doctype html>
<meta charset="utf-8">
<style>
  body { width: 280px; padding: 14px; font: 13px system-ui, sans-serif; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; }
  input[type=password], input[type=range] { width: 100%; box-sizing: border-box; }
  button { margin-top: 8px; }
  small { color: #666; }
</style>
<h3 style="margin:0">Skipper</h3>
<label><input type="checkbox" id="enabled"> Auto-skip enabled</label>
<label>Anthropic API key</label>
<input type="password" id="key" placeholder="sk-ant-...">
<small>Only used for videos nobody has labeled. Stored in this browser only.</small>
<label>Skip threshold: <span id="tv"></span></label>
<input type="range" id="threshold" min="0.3" max="0.95" step="0.05">
<p id="last"><small>No AI run yet.</small></p>
<button id="clear">Clear cached results</button>
<script src="popup.js"></script>
